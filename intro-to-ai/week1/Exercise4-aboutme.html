<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>About me</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        h1 {
            text-align: center;
            font-size: 48px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }
        }

        p {
            color: blue;
        }

        li {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>About Me(as learner)</h1>
    <p>
        Hello!🙋‍♀️I am learning web development and excited to improve my skills. Here are three tasks I need to do:
    </p>
    <ul>
        <li>Learning HTML </li>
        <li>Practice CSS styling</li>
        <li>Start learning JavaScript basics</li>
    </ul>

    <form>
        <button type="submit" onclick="changeBackgroundColor(event)">Submit</button>
    </form>

    <script>
        window.onload = function () {
            alert("Welcome");
        };

        function changeBackgroundColor(event) {
            event.preventDefault(); // Prevents form submission and page reload
            document.body.style.backgroundColor = "#f0e68c"; // Change to any color you like
        }
    </script>
</body>

</html>
